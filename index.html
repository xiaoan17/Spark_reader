<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Spark</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height: 100vh; display: grid; place-items: center; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #4b5563; background: #f4f1ec;">
        正在载入 Spark…
      </div>
    </div>
    <div id="boot-diagnostics" style="display: none; min-height: 100vh; place-items: center; padding: 24px; font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #7f1d1d; background: #fef2f2; white-space: pre-wrap; text-align: center;"></div>
    <script>
      ;(function () {
        function showStartupMessage(message) {
          var fallback = document.getElementById("boot-fallback")
          if (fallback) fallback.textContent = message
          var diagnostics = document.getElementById("boot-diagnostics")
          if (diagnostics) {
            diagnostics.style.display = "grid"
            diagnostics.textContent = message
          }
        }
        window.__focusedReadingShowStartupError = showStartupMessage
        window.addEventListener("error", function (event) {
          showStartupMessage("前端启动失败：" + (event.message || "脚本加载错误"))
        })
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event.reason && (event.reason.message || String(event.reason))
          showStartupMessage("前端启动失败：" + (reason || "异步初始化错误"))
        })
        window.setTimeout(function () {
          var root = document.getElementById("root")
          var fallback = document.getElementById("boot-fallback")
          if (fallback || (root && root.children.length === 0)) {
            showStartupMessage("前端资源仍未完成加载，请重启应用或重新安装最新版本。")
          }
        }, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
