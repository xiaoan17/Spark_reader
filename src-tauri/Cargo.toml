[package]
name = "focused-reading"
version = "0.1.5"
description = "Spark desktop app"
authors = ["anbc"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "focused_reading_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
anyhow = "=1.0.95"
async-trait = "=0.1.83"
dotenvy = "=0.15.7"
futures-util = "=0.3.31"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
reqwest = { version = "=0.12.11", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
quick-xml = { version = "=0.38.4", features = ["serialize"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "functions"] }
serde = { version = "=1.0.225", features = ["derive"] }
serde_json = "=1.0.134"
tauri = { version = "=2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.1"
thiserror = "=2.0.9"
tokio = { version = "=1.42.0", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "process"] }
zip = "=0.6.6"

[dev-dependencies]
pretty_assertions = "=1.4.1"
